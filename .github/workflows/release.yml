name: Release

# Builds the add-in for every Revit version that scripts/install-addin.ps1 supports, plus the MCP
# server with its production dependencies, and publishes one zip per tag. Other machines install
# from that zip without a .NET SDK or a local build. Nothing is published to npm: the package name
# in server/package.json belongs to the upstream project, not to this organization.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The test project in the solution uses Nice3point.Revit.Sdk, which needs the .NET 10 SDK.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # ---------------------------------------------------------------
      # Build MCP Server (TypeScript) and keep only runtime dependencies
      # ---------------------------------------------------------------
      - name: Build MCP Server
        working-directory: server
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "npm run build failed" }
          npm prune --omit=dev
          if ($LASTEXITCODE -ne 0) { throw "npm prune failed" }
        shell: pwsh

      # ---------------------------------------------------------------
      # Build Plugin + CommandSet. dotnet, not msbuild, for every year
      # (same as install-addin.ps1). The commandset's DeployCommandSet
      # target copies its output into the plugin's AddIn layout.
      # ---------------------------------------------------------------
      - name: Build add-in (Revit 2023-2026)
        run: |
          foreach ($short in '23', '24', '25', '26') {
            dotnet build mcp-servers-for-revit.sln -c "Release R$short" -v q -nologo
            if ($LASTEXITCODE -ne 0) { throw "dotnet build failed for Release R$short" }
          }
        shell: pwsh

      # ---------------------------------------------------------------
      # Package the layout install-addin.ps1 expects when it runs from
      # an extracted release (see its "release layout" detection).
      # ---------------------------------------------------------------
      - name: Create release asset
        run: |
          $version = "${{ github.ref_name }}"
          $stage = "release-stage"
          New-Item -ItemType Directory -Force -Path "$stage/addin", "$stage/scripts", "$stage/tools", "$stage/.claude" | Out-Null

          foreach ($year in '2023', '2024', '2025', '2026') {
            $addinDir = "plugin/bin/AddIn $year Release R$($year.Substring(2))"
            if (-not (Test-Path "$addinDir/revit_mcp_plugin/Commands/RevitMCPCommandSet/$year/RevitMCPCommandSet.dll")) {
              throw "Incomplete add-in output for Revit ${year}: $addinDir"
            }
            Copy-Item $addinDir "$stage/addin/$year" -Recurse
          }

          New-Item -ItemType Directory -Force -Path "$stage/server" | Out-Null
          Copy-Item server/build, server/node_modules "$stage/server" -Recurse
          Copy-Item server/package.json, server/package-lock.json "$stage/server"

          Copy-Item scripts/install-addin.ps1, scripts/revit-call.mjs, scripts/run-code.mjs "$stage/scripts"
          Copy-Item tools/pdf-to-revit "$stage/tools" -Recurse
          Copy-Item .claude/skills "$stage/.claude" -Recurse
          Copy-Item command.json, README.md, LICENSE $stage
          Set-Content "$stage/VERSION" $version

          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath "release-assets/mcp-revit-$version.zip"
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
